<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VoiceTyper Settings</title>
    <style>
      body { font-family: Segoe UI, sans-serif; margin: 16px; font-size: 14px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
      .row { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
      .row input[type="checkbox"] { width: auto; }
      button { margin-top: 20px; padding: 8px 16px; }
      #status { margin-left: 12px; color: #2e7d32; }
      textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box;
                 font-family: Consolas, monospace; font-size: 12px; resize: vertical; }
      .pair { display: flex; gap: 8px; }
      .warn { color: #b26500; font-size: 12px; margin-top: 4px; }
      .error { color: #c62828; }
      .hint { color: #666; font-size: 12px; margin-top: 4px; font-weight: 400; }
    </style>
  </head>
  <body>
    <label>Mistral API key
      <input id="apiKey" type="password" placeholder="leave blank to keep current key" />
    </label>
    <label>Language
      <select id="language">
        <option value="auto">Auto-detect</option>
        <option value="de">German</option>
        <option value="en">English</option>
      </select>
    </label>
    <label>Record key
      <select id="recordKey"></select>
    </label>
    <label>Summary keys (hold both)
      <div class="pair">
        <select id="summaryKey1"></select>
        <select id="summaryKey2"></select>
      </div>
      <div class="hint">Must differ from the record key. Holding Space also types
        spaces; some apps claim function keys.</div>
    </label>
    <label>Summary model
      <select id="summaryModel"></select>
      <div id="modelWarn" class="warn" hidden></div>
    </label>
    <label>Summary prompt
      <textarea id="summaryPrompt" rows="6"></textarea>
    </label>
    <label>Separator
      <select id="separator">
        <option value="blank-line">Blank line (Shift+Enter twice)</option>
        <option value="dash">Dash — </option>
        <option value="spaces">Two spaces</option>
      </select>
    </label>
    <label>Microphone
      <select id="mic"><option value="">Default</option></select>
    </label>
    <div class="row">
      <input id="autoLaunch" type="checkbox" />
      <label for="autoLaunch" style="margin:0;font-weight:400;">Launch on login</label>
    </div>
    <div class="row">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
